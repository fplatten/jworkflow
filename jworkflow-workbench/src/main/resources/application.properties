spring.application.name=jworkflow-workbench
server.address=127.0.0.1
server.port=0
spring.ai.model.chat=none
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=gpt-6-astra
spring.ai.retry.max-attempts=4
spring.main.banner-mode=off
server.error.include-message=never
workbench.browser.enabled=true
workbench.session.disconnect-grace=5s
workbench.session.heartbeat-timeout=20s
workbench.session.startup-timeout=120s
