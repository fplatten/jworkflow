name: Durable backend contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_VERSION: 3.9.6
  MAVEN_SHA512: 706f01b20dec0305a822ab614d51f32b07ee11d0218175e55450242e49d2156386483b506b3a4e8a03ac8611bae96395fd5eec15f50d3013d5deed6d1ee18224

jobs:
  # Ordinary tests, PostgreSQL contracts and the coverage gate together, once.
  full:
    name: Full suite and coverage (Java 17, PostgreSQL 17.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_IMAGE: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          # Match the exact version advertised by the Temurin API.
          java-version: '17.0.10+7'
          cache: maven
      - name: Install pinned Maven
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://archive.apache.org/dist/maven/maven-3/$MAVEN_VERSION/binaries/apache-maven-$MAVEN_VERSION-bin.tar.gz" -o "$RUNNER_TEMP/maven.tgz"
          echo "$MAVEN_SHA512  $RUNNER_TEMP/maven.tgz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"
      - name: Require database availability
        run: |
          docker info
          docker pull "$POSTGRES_IMAGE"
          mvn --version
      - name: Ordinary and PostgreSQL contracts with restart example
        id: full
        run: mvn -B -ntp -Ppostgres-it clean verify "-Dpostgres.image=$POSTGRES_IMAGE"
      - name: Preserve reports
        if: ${{ always() && hashFiles('**/target/surefire-reports/**', '**/target/failsafe-reports/**') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: full-pg17.11-java17
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/pg12-evidence/**
            **/target/site/jacoco*/**
          if-no-files-found: error
      - name: Require all executed contracts without skips
        run: python3 .github/scripts/verify-postgres-reports.py
      - name: Require at least 80 percent coverage in every module
        run: python3 .github/scripts/verify-coverage.py

  # Ordinary tests on the other supported JDK; no database needed.
  ordinary-java21:
    name: Ordinary suite (Java 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21.0.7+6.0.LTS'
          cache: maven
      - name: Install pinned Maven
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://archive.apache.org/dist/maven/maven-3/$MAVEN_VERSION/binaries/apache-maven-$MAVEN_VERSION-bin.tar.gz" -o "$RUNNER_TEMP/maven.tgz"
          echo "$MAVEN_SHA512  $RUNNER_TEMP/maven.tgz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"
      - name: Ordinary reactor contracts
        run: mvn -B -ntp clean verify
      - name: Preserve reports
        if: ${{ always() && hashFiles('**/target/surefire-reports/**') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ordinary-java21
          path: '**/target/surefire-reports/**'
          if-no-files-found: error

  # PostgreSQL contracts on the remaining server/JDK combinations. Ordinary tests are not repeated:
  # Surefire is pointed at a test name that does not exist.
  postgres:
    name: PostgreSQL ${{ matrix.postgres }} (Java ${{ matrix.java }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { java: '17.0.10+7', postgres: '16.15', image: 'postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94' }
          - { java: '17.0.10+7', postgres: '18.6', image: 'postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280' }
          - { java: '21.0.7+6.0.LTS', postgres: '16.15', image: 'postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94' }
          - { java: '21.0.7+6.0.LTS', postgres: '17.11', image: 'postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675' }
          - { java: '21.0.7+6.0.LTS', postgres: '18.6', image: 'postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280' }
    env:
      POSTGRES_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Install pinned Maven
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://archive.apache.org/dist/maven/maven-3/$MAVEN_VERSION/binaries/apache-maven-$MAVEN_VERSION-bin.tar.gz" -o "$RUNNER_TEMP/maven.tgz"
          echo "$MAVEN_SHA512  $RUNNER_TEMP/maven.tgz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"
      - name: Require database availability
        run: |
          docker info
          docker pull "$POSTGRES_IMAGE"
          mvn --version
      - name: PostgreSQL contracts and restart example
        run: >-
          mvn -B -ntp -Ppostgres-it clean verify "-Dpostgres.image=$POSTGRES_IMAGE"
          -Dtest=NoOrdinaryTestsInThisJob -Dsurefire.failIfNoSpecifiedTests=false
      - name: Preserve reports
        if: ${{ always() && hashFiles('**/target/failsafe-reports/**') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: postgres-pg${{ matrix.postgres }}-java${{ matrix.java }}
          path: |
            **/target/failsafe-reports/**
            **/target/pg12-evidence/**
          if-no-files-found: error
      - name: Require all executed contracts without skips
        run: python3 .github/scripts/verify-postgres-reports.py
