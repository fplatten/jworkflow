name: Durable backend contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['17.0.10+7', '21.0.7+6']
        postgres:
          - version: '16.15'
            image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
          - version: '17.11'
            image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
          - version: '18.6'
            image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Install pinned Maven
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz -o "$RUNNER_TEMP/maven.tgz"
          echo "706f01b20dec0305a822ab614d51f32b07ee11d0218175e55450242e49d2156386483b506b3a4e8a03ac8611bae96395fd5eec15f50d3013d5deed6d1ee18224  $RUNNER_TEMP/maven.tgz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.6/bin" >> "$GITHUB_PATH"
      - name: Require database availability
        env:
          POSTGRES_IMAGE: ${{ matrix.postgres.image }}
        run: |
          docker info
          docker pull "$POSTGRES_IMAGE"
          mvn --version
      - name: Ordinary reactor contracts
        run: mvn -B -ntp clean verify
      - name: Preserve ordinary reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ordinary-pg${{ matrix.postgres.version }}-java${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: error
      - name: PostgreSQL reactor contracts and restart example
        env:
          POSTGRES_IMAGE: ${{ matrix.postgres.image }}
        run: mvn -B -ntp -Ppostgres-it clean verify "-Dpostgres.image=$POSTGRES_IMAGE"
      - name: Preserve database reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: postgres-pg${{ matrix.postgres.version }}-java${{ matrix.java }}
          path: |
            **/target/failsafe-reports/**
            **/target/pg12-evidence/**
            **/target/surefire-reports/**
          if-no-files-found: error
      - name: Require all executed contracts without skips
        run: python3 .github/scripts/verify-postgres-reports.py
